<!--
  Szablon EmailJS powiadomienia dla rodzica (docs/v2/PLAN.md 9.1, 6-3b): granie co najmniej
  60 minut jednego dnia albo zakup. Wysyła funkcja parentAlertOnGaming / parentAlertOnPurchase.

  JAK UŻYĆ (właściciel, jednorazowo):
  1. EmailJS dashboard → Email Templates → Create New Template (ta sama usługa service_417sg11).
  2. Ustawienia szablonu:
       To Email:  {{to_email}}
       Subject:   {{alert_subject}}
       From Name: LifeXP
  3. Treść: przełącz edytor w tryb "Code editor" (ikona </>) i wklej CAŁY ten plik.
  4. Zapisz i skopiuj Template ID (np. template_xxxxxxx) do stałej PARENT_ALERT_TEMPLATE_ID
     w functions/src/alerts/config.ts, potem deploy (npm run deploy w functions/).
     Do tego czasu funkcja niczego nie wysyła (w logach: templateMissing).

  Zmienne (wszystkie tekstowe):
    to_email, user_name, alert_subject, alert_body, alert_day
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>LifeXP — powiadomienie</title>
</head>
<body style="margin:0;padding:0;background-color:#0e0f13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#0e0f13;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;background-color:#16181f;border-radius:16px;border:1px solid #2a2d3a;overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(135deg,#6c63ff,#4ecca3);padding:28px 32px 24px;text-align:center;">
              <p style="margin:0;font-size:11px;font-weight:600;color:rgba(255,255,255,0.75);letter-spacing:2px;">POWIADOMIENIE DLA RODZICA</p>
              <h1 style="margin:8px 0 0;font-size:24px;font-weight:700;color:#ffffff;">LifeXP</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px;">
              <p style="margin:0;font-size:13px;color:#8a8fa8;">{{alert_day}} · konto <strong style="color:#e8eaf0;">{{user_name}}</strong></p>
              <h2 style="margin:10px 0 0;font-size:20px;font-weight:700;color:#e8eaf0;">{{alert_subject}}</h2>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 28px;">
              <p style="margin:0;font-size:15px;color:#e8eaf0;line-height:1.6;white-space:pre-line;">{{alert_body}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 24px;border-top:1px solid #2a2d3a;">
              <p style="margin:0;font-size:12px;color:#8a8fa8;line-height:1.6;">Najwyżej jedno takie powiadomienie każdego rodzaju dziennie. Dziecko może je wyłączyć w Ustawieniach aplikacji („Powiadomienia dla rodzica”), a szczegóły widać w panelu rodzica.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
