<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Strażnicy Doliny</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main id="app" class="app" data-screen="start">

  <section id="start" class="screen screen--start" aria-labelledby="start-title">
    <header class="start__head">
      <h1 id="start-title" class="start__title" data-t="title"></h1>
      <p class="start__intro" data-t="intro"></p>
    </header>
    <h2 class="start__pick" data-t="pickMap"></h2>
    <ul id="map-list" class="maps"></ul>
    <p class="start__hint" data-t="keysHint"></p>
  </section>

  <section id="custom" class="screen screen--custom" aria-labelledby="custom-title">
    <header class="custom__head">
      <h1 id="custom-title" class="custom__title" data-t="customMode"></h1>
      <button id="custom-back" class="chip" type="button" data-t="back"></button>
    </header>
    <p class="custom__note" data-t="customNote"></p>

    <h2 class="custom__label" id="custom-map-label" data-t="map"></h2>
    <div id="custom-maps" class="choices" role="radiogroup" aria-labelledby="custom-map-label"></div>
    <div class="custom__row">
      <button id="custom-new" class="button" type="button" data-t="newMap"></button>
      <button id="custom-edit" class="button" type="button" data-t="editMap"></button>
      <button id="custom-delete" class="button" type="button" data-t="deleteMap"></button>
    </div>

    <h2 class="custom__label" id="custom-gold-label" data-t="goldMode"></h2>
    <div id="custom-gold" class="segmented segmented--plain" role="radiogroup" aria-labelledby="custom-gold-label">
      <button class="segmented__option" type="button" role="radio" data-gold="default" data-t="goldDefault"></button>
      <button class="segmented__option" type="button" role="radio" data-gold="infinite" data-t="goldInfinite"></button>
      <button class="segmented__option" type="button" role="radio" data-gold="custom" data-t="goldCustom"></button>
    </div>
    <div id="custom-amount" class="stepper" role="group" aria-labelledby="custom-gold-label">
      <button class="chip" type="button" data-step="-100" aria-label="-100">-100</button>
      <button class="chip" type="button" data-step="-10" aria-label="-10">-10</button>
      <output id="custom-amount-value" class="stepper__value numeric" aria-live="polite"></output>
      <button class="chip" type="button" data-step="10" aria-label="+10">+10</button>
      <button class="chip" type="button" data-step="100" aria-label="+100">+100</button>
    </div>

    <h2 class="custom__label" id="custom-enemy-label" data-t="enemiesMode"></h2>
    <div id="custom-enemies-mode" class="segmented segmented--plain segmented--two" role="radiogroup" aria-labelledby="custom-enemy-label">
      <button class="segmented__option" type="button" role="radio" data-enemies="default" data-t="enemiesDefault"></button>
      <button class="segmented__option" type="button" role="radio" data-enemies="pick" data-t="enemiesPick"></button>
    </div>
    <div id="custom-pick" class="custom__pick">
      <ul id="custom-kinds" class="kinds" aria-labelledby="custom-enemy-label"></ul>
      <div class="custom__row custom__row--wrap">
        <span class="custom__sub" id="custom-waves-label" data-t="wavesCount"></span>
        <div class="stepper" role="group" aria-labelledby="custom-waves-label">
          <button class="chip" type="button" data-waves="-5" aria-label="-5">-5</button>
          <button class="chip" type="button" data-waves="-1" aria-label="-1">-1</button>
          <output id="custom-waves-value" class="stepper__value numeric" aria-live="polite"></output>
          <button class="chip" type="button" data-waves="1" aria-label="+1">+1</button>
          <button class="chip" type="button" data-waves="5" aria-label="+5">+5</button>
        </div>
      </div>
      <button id="custom-bosses" class="chip" type="button" aria-pressed="true" data-t="bosses"></button>
      <div id="custom-difficulty" class="segmented segmented--plain" role="radiogroup" aria-labelledby="custom-diff-label">
        <span id="custom-diff-label" class="segmented__label" data-t="difficulty"></span>
        <button class="segmented__option" type="button" role="radio" data-difficulty="0.75" data-t="diffEasy"></button>
        <button class="segmented__option" type="button" role="radio" data-difficulty="1" data-t="diffNormal"></button>
        <button class="segmented__option" type="button" role="radio" data-difficulty="1.5" data-t="diffHard"></button>
      </div>
    </div>

    <p id="custom-problem" class="custom__problem" role="status"></p>
    <button id="custom-play" class="button button--primary custom__play" type="button" data-t="play"></button>
  </section>

  <section id="editor" class="screen screen--editor" aria-labelledby="editor-title">
    <header class="custom__head">
      <h1 id="editor-title" class="custom__title" data-t="editor"></h1>
      <button id="editor-back" class="chip" type="button" data-t="back"></button>
    </header>
    <label class="editor__name">
      <span class="custom__sub" data-t="mapName"></span>
      <input id="editor-name" class="editor__input" type="text" maxlength="16" autocomplete="off" spellcheck="false">
    </label>
    <div id="editor-tool" class="segmented segmented--plain segmented--two" role="radiogroup" aria-labelledby="editor-tool-label">
      <span id="editor-tool-label" class="segmented__label" data-t="tool"></span>
      <button class="segmented__option" type="button" role="radio" data-tool="road" data-t="toolRoad"></button>
      <button class="segmented__option" type="button" role="radio" data-tool="pads" data-t="toolPads"></button>
    </div>
    <div id="editor-look" class="segmented segmented--plain" role="radiogroup" aria-labelledby="editor-look-label">
      <span id="editor-look-label" class="segmented__label" data-t="look"></span>
      <button class="segmented__option" type="button" role="radio" data-look="meadow" data-t="map.meadow"></button>
      <button class="segmented__option" type="button" role="radio" data-look="canyon" data-t="map.canyon"></button>
      <button class="segmented__option" type="button" role="radio" data-look="marsh" data-t="map.marsh"></button>
    </div>
    <div class="editor__grid-wrap">
      <canvas id="editor-grid" class="editor__grid" role="img" aria-labelledby="editor-status"></canvas>
    </div>
    <p id="editor-status" class="custom__problem" role="status"></p>
    <div class="custom__row">
      <button id="editor-undo" class="button" type="button" data-t="undo"></button>
      <button id="editor-clear" class="button" type="button" data-t="clear"></button>
      <button id="editor-save" class="button button--primary" type="button" data-t="save"></button>
    </div>
  </section>

  <section id="play" class="screen screen--play" aria-labelledby="play-map">
    <header class="hud">
      <h2 id="play-map" class="visually-hidden"></h2>
      <ul class="hud__stats">
        <li id="hud-gold" class="stat stat--gold">
          <span class="hud-icon" data-icon="coin" aria-hidden="true"></span>
          <span data-t="gold"></span> <strong id="gold" class="numeric">0</strong>
        </li>
        <li id="hud-lives" class="stat stat--lives">
          <span class="hud-icon" data-icon="heart" aria-hidden="true"></span>
          <span data-t="lives"></span> <strong id="lives" class="numeric">0</strong>
        </li>
        <li class="stat stat--wave">
          <span class="hud-icon" data-icon="flag" aria-hidden="true"></span>
          <span data-t="wave"></span> <strong id="wave" class="numeric">0</strong>
        </li>
      </ul>
    </header>

    <div id="stage" class="stage">
      <canvas id="ground" class="board board--ground" aria-hidden="true"></canvas>
      <canvas id="board" class="board" aria-hidden="true"></canvas>
      <div class="edge" aria-hidden="true"></div>
      <div id="pads" class="pads" role="group" aria-labelledby="play-map"></div>
      <p id="hint" class="hint" data-t="hint"></p>
      <p id="banner" class="banner" role="status" aria-live="polite"></p>
    </div>

    <footer class="wavebar">
      <div class="wavebar__info">
        <p id="wave-status" class="wavebar__status"></p>
        <ul id="wave-preview" class="preview"></ul>
      </div>
      <div class="wavebar__actions">
        <button id="pause" class="chip" type="button" aria-pressed="false">
          <span class="hud-icon" data-icon="pause" aria-hidden="true"></span>
          <span data-t="pause"></span>
        </button>
        <button id="speed" class="chip" type="button" aria-pressed="false">
          <span class="hud-icon" data-icon="speed" aria-hidden="true"></span>
          <span id="speed-text"></span>
        </button>
        <button id="call-wave" class="button button--primary wavebar__call" type="button"></button>
      </div>
    </footer>

    <aside id="panel" class="panel" aria-labelledby="panel-title" hidden>
      <header class="panel__head">
        <h3 id="panel-title" class="panel__title"></h3>
        <button id="panel-close" class="chip" type="button" data-t="close"></button>
      </header>
      <div id="build-menu" class="panel__body">
        <ul id="tower-options" class="options" role="radiogroup" aria-labelledby="panel-title"></ul>
        <p id="option-role" class="panel__role"></p>
        <p id="option-stats" class="panel__stats"></p>
        <button id="build" class="button button--primary" type="button"></button>
      </div>
      <div id="tower-menu" class="panel__body">
        <div id="tower-preview" class="panel__preview" aria-hidden="true"></div>
        <p id="tower-level" class="panel__level"></p>
        <p id="tower-stats" class="panel__stats"></p>
        <div id="priority" class="segmented" role="radiogroup" aria-labelledby="priority-label">
          <span id="priority-label" class="segmented__label" data-t="target"></span>
          <button class="segmented__option" type="button" role="radio" aria-checked="true" data-priority="first" data-t="priority.first"></button>
          <button class="segmented__option" type="button" role="radio" aria-checked="false" data-priority="strongest" data-t="priority.strongest"></button>
          <button class="segmented__option" type="button" role="radio" aria-checked="false" data-priority="closest" data-t="priority.closest"></button>
        </div>
        <div class="panel__actions">
          <button id="upgrade" class="button button--primary" type="button"></button>
          <button id="sell" class="button button--secondary" type="button"></button>
        </div>
      </div>
    </aside>

    <div id="pause-overlay" class="overlay" hidden>
      <div class="overlay__card" role="dialog" aria-modal="false" aria-labelledby="pause-title">
        <h3 id="pause-title" class="overlay__title" data-t="paused"></h3>
        <button id="resume" class="button button--primary" type="button" data-t="resume"></button>
        <button id="restart" class="button button--secondary" type="button" data-t="restart"></button>
        <button id="to-maps" class="button button--secondary" type="button" data-t="maps"></button>
      </div>
    </div>
  </section>

  <section id="end" class="screen screen--end" aria-labelledby="end-title">
    <div class="end-card">
      <h2 id="end-title" class="end__title"></h2>
      <p id="end-map" class="end__map"></p>
      <p id="end-stars" class="end__stars"></p>
      <p id="end-badge" class="badge" hidden></p>
      <ul class="end__stats">
        <li id="end-lives" class="numeric"></li>
        <li id="end-waves" class="numeric"></li>
        <li id="end-kills" class="numeric"></li>
      </ul>
      <div class="end__actions">
        <button id="next-map" class="button button--primary" type="button" data-t="nextMap"></button>
        <button id="again" class="button button--secondary" type="button" data-t="again"></button>
        <button id="end-maps" class="button button--secondary" type="button" data-t="toMaps"></button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
