name: Tests

# Pull requests are tested on their merge commit; branches without a PR are not.
# (Testing both push and pull_request ran every job twice per PR.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moves to a new
# Ubuntu from 2026-10-19: an image change should be a reviewed commit, not a surprise
# (a new image first ran apt for ~10 min and cut the v2 job off). The cost: moving on
# is a manual bump here and in fps.yml before GitHub retires 24.04.

jobs:
  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Chromium for Playwright: the browser is cached per
      # Playwright version; system libraries cannot be cached, so they are installed
      # only when the runner image lacks some (apt on the runners can take ~10 min).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Chromium's system libraries (only if the image lacks some)
        timeout-minutes: 12
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) -perm -u+x -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "The runner image has every library Chromium needs."
          fi
      - run: npx playwright test --project=app
      # The agent sandbox cannot read artifacts (blob host blocked), so failures print their page snapshots here.
      - name: Print Playwright error contexts
        if: failure()
        run: |
          find test-results -name error-context.md -print0 2>/dev/null | sort -z | while IFS= read -r -d '' file; do
            echo "===== $file ====="
            head -n 400 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-app-results
          path: test-results/
          retention-days: 7

  v2:
    name: v2 checks and site build
    runs-on: ubuntu-24.04
    # Checks, build and ~6 min of browser tests; the rest is room for a slow install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json
            functions/package-lock.json
      # The browser tests sign in on the Firebase emulators; Firestore's is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefix v2
      # test:v2 runs exusTurn on the Functions emulator (fake model, no key).
      - run: npm ci --prefix functions
      # typecheck, architecture lint, unit tests
      - run: npm run check --prefix v2
      - run: npm run build --prefix v2
      # Same assembly as the Deploy workflow, so a missing v1 file fails here, not in production.
      - run: node scripts/build-site.js --out _site
      # The app in a real browser, signed in on the emulators: login and boot
      # gates, drawer, sidebar, themes, layout (tests/v2). Rebuilds v2 (seconds).
      - run: npm ci
      # Chromium for Playwright: the browser is cached per
      # Playwright version; system libraries cannot be cached, so they are installed
      # only when the runner image lacks some (apt on the runners can take ~10 min).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Chromium's system libraries (only if the image lacks some)
        timeout-minutes: 12
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) -perm -u+x -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "The runner image has every library Chromium needs."
          fi
      - run: npm run test:v2
      # The agent sandbox cannot read artifacts (blob host blocked), so failures print their page snapshots here.
      - name: Print Playwright error contexts
        if: failure()
        run: |
          find test-results -name error-context.md -print0 2>/dev/null | sort -z | while IFS= read -r -d '' file; do
            echo "===== $file ====="
            head -n 400 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-v2-results
          path: |
            test-results/
            firestore-debug.log
          retention-days: 7

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      # exusTurn unit tests (node:test, in-memory Firestore, no network, no secret).
      - run: npm test --prefix functions

  emulator:
    name: v1 against Firebase emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Chromium for Playwright: the browser is cached per
      # Playwright version; system libraries cannot be cached, so they are installed
      # only when the runner image lacks some (apt on the runners can take ~10 min).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Chromium's system libraries (only if the image lacks some)
        timeout-minutes: 12
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) -perm -u+x -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "The runner image has every library Chromium needs."
          fi
      - run: npm run test:emulator
      # The agent sandbox cannot read artifacts (blob host blocked), so failures print their page snapshots here.
      - name: Print Playwright error contexts
        if: failure()
        run: |
          find test-results -name error-context.md -print0 2>/dev/null | sort -z | while IFS= read -r -d '' file; do
            echo "===== $file ====="
            head -n 400 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-emulator-results
          path: |
            test-results/
            firestore-debug.log
          retention-days: 7
