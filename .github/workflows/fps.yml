name: FPS gameplay

# The FPS game (fps.html) is self-contained: all of its code is inline and Three.js
# comes from a CDN (served from node_modules in tests). Its gameplay tests run a
# software-WebGL scene for ~8 minutes, so they run only when something they test
# can change. The quick fps.html checks (tests/fps.spec.js) stay in "Tests" › App
# on every change. Run it by hand from the Actions tab when in doubt.
on:
  push:
    branches: [main]
    paths:
      - fps.html
      - tests/fps-gameplay.spec.js
      - playwright.config.js
      - package.json
      - package-lock.json
      - .github/workflows/fps.yml
  pull_request:
    paths:
      - fps.html
      - tests/fps-gameplay.spec.js
      - playwright.config.js
      - package.json
      - package-lock.json
      - .github/workflows/fps.yml
  workflow_dispatch:

concurrency:
  group: fps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fps:
    name: FPS gameplay
    # Pinned like the Tests workflow (see test.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Chromium for Playwright: the browser is cached per
      # Playwright version; system libraries cannot be cached, so they are installed
      # only when the runner image lacks some (apt on the runners can take ~10 min).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Chromium's system libraries (only if the image lacks some)
        timeout-minutes: 12
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) -perm -u+x -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "The runner image has every library Chromium needs."
          fi
      # Software-WebGL scenes; own workflow so they do not compete for CPU with the app tests.
      - run: npx playwright test --project=fps-gameplay
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fps-results
          path: test-results/
          retention-days: 7
